<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision-Craft: Object Controller Arena</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #111827;
            --primary: #3b82f6;
            --enemy: #ef4444;
            --text: #f3f4f6;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Left Side: Setup, Scanning, Webcam */
        #setup-panel {
            width: 350px;
            background-color: var(--panel-bg);
            border-right: 2px solid #1f2937;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* Right Side: Main Arena Game */
        #game-panel {
            flex-grow: 1;
            position: relative;
            background: #020617;
        }

        video {
            display: none; /* Hidden data processing element */
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        canvas#viewfinder {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror view for natural interaction */
        }

        .instruction-box {
            background: #1e293b;
            border-left: 4px solid var(--primary);
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        input {
            background: #030712;
            border: 1px solid #374151;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        canvas#game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #hud {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 22px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .network-bar {
            margin-top: auto;
            background: #030712;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <div id="setup-panel">
            <h2>🔍 Object Scanner</h2>
            
            <div class="video-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="viewfinder"></canvas>
            </div>

            <div class="instruction-box" id="guide-text">
                <strong>STEP 1:</strong> Place your cylinder object (cup, bottle, roll) completely in front of the camera lens and press "Scan Controller".
            </div>

            <button id="scan-btn" onclick="calibrateObjectColor()">1. Scan Cylinder Object</button>
            
            <hr style="border: 0; border-top: 1px solid #374151; margin: 15px 0;">

            <h3>👥 Live Matchmaking</h3>
            <div style="font-size: 13px; margin-bottom: 8px; color: #9ca3af;">Connect with real players over peer network:</div>
            
            <input type="text" id="target-room-input" placeholder="Enter Friend's Arena ID">
            <button style="background-color: #10b981;" onclick="connectToOpponent()">2. Challenge Real Player</button>

            <div class="network-bar">
                <div>Your Arena ID: <span id="my-id-display" style="color: var(--primary); font-weight:bold;">Connecting...</span></div>
                <div id="net-status" style="color: #6b7280; margin-top: 4px;">Standalone Mode</div>
            </div>
        </div>

        <div id="game-panel">
            <div id="hud">
                <div style="color: var(--primary);">You: <span id="score-p1">0</span></div>
                <div style="color: var(--enemy);">Opponent: <span id="score-p2">0</span></div>
            </div>
            <canvas id="game-canvas"></canvas>
        </div>

    </div>

    <script>
        // Computer Vision & Tracking Variables
        const video = document.getElementById('webcam');
        const viewCanvas = document.getElementById('viewfinder');
        const viewCtx = viewCanvas.getContext('2d', { willReadFrequently: true });
        
        let targetColor = null; // Stores RGB color profile of your scanned object
        let controllerY = 0.5;  // Tracks current position of scanned object (0 to 1)

        // Networking Variables
        let peer = null;
        let conn = null;
        let isHost = true;

        // Core Arena Graphics Setup
        const gameCanvas = document.getElementById('game-canvas');
        const gameCtx = gameCanvas.getContext('2d');
        let p1Y = 0.5, p2Y = 0.5;
        let ball = { x: 0.5, y: 0.5, vx: 0.004, vy: 0.002, r: 0.012 };
        let scores = { p1: 0, p2: 0 };

        // Initialize Local Hardware Camera
        navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } })
            .then(stream => {
                video.srcObject = stream;
                video.addEventListener('loadedmetadata', () => {
                    viewCanvas.width = video.videoWidth;
                    viewCanvas.height = video.videoHeight;
                    requestAnimationFrame(trackObjectLoop);
                });
            })
            .catch(err => {
                document.getElementById('guide-text').innerHTML = "❌ Camera access denied. Vision controller tracking unavailable.";
            });

        // Initialize Peer Matchmaking Infrastructure
        const myRoomId = Math.floor(100000 + Math.random() * 900000).toString();
        document.getElementById('my-id-display').innerText = myRoomId;
        
        peer = new Peer(myRoomId + "-vision-game");
        peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            isHost = false; // Guest screen yields physics authority to Room Creator
            document.getElementById('net-status').innerText = "Connected to Opponent!";
            setupNetworkListener();
        });

        function connectToOpponent() {
            const remoteId = document.getElementById('target-room-input').value.trim();
            if(!remoteId) return alert("Please enter an Arena ID!");
            
            conn = peer.connect(remoteId + "-vision-game");
            isHost = true;
            document.getElementById('net-status').innerText = "Connecting...";
            conn.on('open', () => {
                document.getElementById('net-status').innerText = "Connected to Opponent!";
                setupNetworkListener();
            });
        }

        function setupNetworkListener() {
            conn.on('data', (data) => {
                if(data.type === 'paddle') {
                    if(isHost) p2Y = data.y; // If host, remote player controls Paddle 2
                    else p1Y = data.y;      // If guest, remote player controls Paddle 1
                }
                if(!isHost && data.type === 'ball_sync') {
                    ball = data.ball;
                    scores = data.scores;
                    document.getElementById('score-p1').innerText = scores.p1;
                    document.getElementById('score-p2').innerText = scores.p2;
                }
            });
        }

        // Object Scanning Routine
        function calibrateObjectColor() {
            // Sample pixels right out of the center frame to bind to your specific physical cylinder
            const cx = viewCanvas.width / 2;
            const cy = viewCanvas.height / 2;
            const imgData = viewCtx.getImageData(cx - 5, cy - 5, 10, 10).data;
            
            let r=0, g=0, b=0, count=0;
            for(let i=0; i<imgData.length; i+=4) {
                r += imgData[i];
                g += imgData[i+1];
                b += imgData[i+2];
                count++;
            }
            targetColor = { r: r/count, g: g/count, b: b/count };
            
            // Dynamic generation of UI instructions based on parsed properties
            document.getElementById('guide-text').innerHTML = `
                <strong>Cylinder Scanned!</strong><br>
                🎨 Color Lock: <span style="display:inline-block; width:12px; height:12px; background:rgb(${targetColor.r},${targetColor.g},${targetColor.b})"></span><br>
                🎮 <strong>Instructions:</strong> Move your object Up and Down in front of the camera like a flight joystick to slide your paddle!
            `;
        }

        // Processing loop analyzing color changes inside frames
        function trackObjectLoop() {
            viewCtx.drawImage(video, 0, 0, viewCanvas.width, viewCanvas.height);

            if (targetColor) {
                const imgData = viewCtx.getImageData(0, 0, viewCanvas.width, viewCanvas.height);
                const data = imgData.data;

                let sumY = 0;
                let matchedPixels = 0;

                // Color-matching algorithm checks frame matrix for matching pixels
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];
                    let g = data[i+1];
                    let b = data[i+2];

                    // Simple Euclidean distance thresholds color similarity
                    let dist = Math.sqrt((r-targetColor.r)**2 + (g-targetColor.g)**2 + (b-targetColor.b)**2);
                    if (dist < 45) { // Match sensitivity barrier
                        let pixelIdx = i / 4;
                        let y = Math.floor(pixelIdx / viewCanvas.width);
                        sumY += y;
                        matchedPixels++;

                        // Visual overlay on viewfinder tracking match data
                        data[i] = 16; data[i+1] = 185; data[i+2] = 129;
                    }
                }

                if (matchedPixels > 30) {
                    let avgY = sumY / matchedPixels;
                    controllerY = avgY / viewCanvas.height; // Normalize position (0.0 to 1.0)
                    
                    // Assign positions depending on Host or Guest states
                    if(isHost) p1Y = controllerY;
                    else p2Y = controllerY;

                    // Send updated movement across the peer network to the other human
                    if(conn && conn.open) {
                        conn.send({ type: 'paddle', y: controllerY });
                    }
                }
                viewCtx.putImageData(imgData, 0, 0);
            } else {
                // Visual Reticle Helper Overlay
                viewCtx.strokeStyle = '#3b82f6';
                viewCtx.lineWidth = 3;
                viewCtx.strokeRect(viewCanvas.width/2 - 25, viewCanvas.height/2 - 25, 50, 50);
            }

            requestAnimationFrame(trackObjectLoop);
        }

        // Render Canvas Sizing Rules
        function resizeGameCanvas() {
            gameCanvas.width = gameCanvas.parentElement.clientWidth;
            gameCanvas.height = gameCanvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeGameCanvas);
        resizeGameCanvas();

        // Standard Physics Loop running concurrently on host end
        function processGameFrame() {
            if (isHost && conn && conn.open) {
                ball.x += ball.vx;
                ball.y += ball.vy;

                if (ball.y - ball.r <= 0 || ball.y + ball.r >= 1) ball.vy = -ball.vy;

                // Paddle 1 Tracking Bounds
                if (ball.x - ball.r <= 0.04) {
                    if (ball.y >= p1Y - 0.1 && ball.y <= p1Y + 0.1) {
                        ball.vx = Math.abs(ball.vx) * 1.05;
                    } else if (ball.x < 0) {
                        scores.p2++;
                        resetArenaBall();
                    }
                }

                // Paddle 2 Tracking Bounds
                if (ball.x + ball.r >= 0.96) {
                    if (ball.y >= p2Y - 0.1 && ball.y <= p2Y + 0.1) {
                        ball.vx = -Math.abs(ball.vx) * 1.05;
                    } else if (ball.x > 1) {
                        scores.p1++;
                        resetArenaBall();
                    }
                }

                conn.send({ type: 'ball_sync', ball: ball, scores: scores });
                document.getElementById('score-p1').innerText = scores.p1;
                document.getElementById('score-p2').innerText = scores.p2;
            }

            // RENDERING GAME VIEWS
            gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

            const pw = gameCanvas.width * 0.015;
            const ph = gameCanvas.height * 0.2;

            // Draw Paddle 1 (Blue)
            gameCtx.fillStyle = '#3b82f6';
            gameCtx.fillRect(gameCanvas.width * 0.04 - pw/2, (p1Y * gameCanvas.height) - ph/2, pw, ph);

            // Draw Paddle 2 (Red)
            gameCtx.fillStyle = '#ef4444';
            gameCtx.fillRect(gameCanvas.width * 0.96 - pw/2, (p2Y * gameCanvas.height) - ph/2, pw, ph);

            // Draw Ball
            gameCtx.beginPath();
            gameCtx.arc(ball.x * gameCanvas.width, ball.y * gameCanvas.height, ball.r * gameCanvas.width, 0, Math.PI*2);
            gameCtx.fillStyle = '#ffffff';
            gameCtx.fill();

            requestAnimationFrame(processGameFrame);
        }

        function resetArenaBall() {
            ball.x = 0.5; ball.y = 0.5;
            ball.vx = (Math.random() > 0.5 ? 1 : -1) * 0.004;
            ball.vy = (Math.random() - 0.5) * 0.005;
        }

        requestAnimationFrame(processGameFrame);
    </script>
</body>
</html>
