<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision-Craft: Proximity Object Arena</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #111827;
            --primary: #3b82f6;
            --enemy: #ef4444;
            --text: #f3f4f6;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Left Side: Setup, Scanning, Webcam */
        #setup-panel {
            width: 350px;
            background-color: var(--panel-bg);
            border-right: 2px solid #1f2937;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            overflow-y: auto;
        }

        /* Right Side: Main Arena Game */
        #game-panel {
            flex-grow: 1;
            position: relative;
            background: #020617;
        }

        video {
            display: none; /* Hidden processing data */
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        canvas#viewfinder {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror view for natural interaction */
        }

        .instruction-box {
            background: #1e293b;
            border-left: 4px solid var(--primary);
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        input {
            background: #030712;
            border: 1px solid #374151;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .slider-group {
            margin: 10px 0 20px 0;
            background: #1e293b;
            padding: 10px;
            border-radius: 6px;
        }

        .slider-group label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 5px;
        }

        .slider-group input[type="range"] {
            width: 100%;
            margin: 0;
        }

        canvas#game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #hud {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 22px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .network-bar {
            margin-top: auto;
            background: #030712;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <div id="setup-panel">
            <h2>🔍 Proximity Scanner</h2>
            
            <div class="video-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="viewfinder"></canvas>
            </div>

            <div class="instruction-box" id="guide-text">
                <strong>STEP 1:</strong> Hold your cylinder object close to the camera lens and wave it up and down to let the engine lock onto it.
            </div>

            <button id="scan-btn" onclick="lockNearestObject()">1. Lock Onto Nearest Object</button>
            
            <div class="slider-group">
                <label id="motion-label">Motion Filter Threshold: 30</label>
                <input type="range" id="motion-slider" min="10" max="80" value="30" oninput="updateMotionSlider()">
            </div>

            <hr style="border: 0; border-top: 1px solid #374151; margin: 15px 0;">

            <h3>👥 Live Matchmaking</h3>
            
            <input type="text" id="target-room-input" placeholder="Enter Friend's Arena ID">
            <button style="background-color: #10b981;" onclick="connectToOpponent()">2. Challenge Real Player</button>

            <div class="network-bar">
                <div>Your Arena ID: <span id="my-id-display" style="color: var(--primary); font-weight:bold;">Connecting...</span></div>
                <div id="net-status" style="color: #6b7280; margin-top: 4px;">Standalone Mode</div>
            </div>
        </div>

        <div id="game-panel">
            <div id="hud">
                <div style="color: var(--primary);">You: <span id="score-p1">0</span></div>
                <div style="color: var(--enemy);">Opponent: <span id="score-p2">0</span></div>
            </div>
            <canvas id="game-canvas"></canvas>
        </div>

    </div>

    <script>
        // Computer Vision & Proximity Variables
        const video = document.getElementById('webcam');
        const viewCanvas = document.getElementById('viewfinder');
        const viewCtx = viewCanvas.getContext('2d', { willReadFrequently: true });
        const motionSlider = document.getElementById('motion-slider');
        
        let prevFrameData = null;
        let objectLocked = false;
        let controllerY = 0.5;  
        let motionThreshold = 30;

        // Networking Variables
        let peer = null;
        let conn = null;
        let isHost = true;

        // Core Arena Graphics Setup
        const gameCanvas = document.getElementById('game-canvas');
        const gameCtx = gameCanvas.getContext('2d');
        let p1Y = 0.5, p2Y = 0.5;
        let ball = { x: 0.5, y: 0.5, vx: 0.004, vy: 0.002, r: 0.012 };
        let scores = { p1: 0, p2: 0 };

        function updateMotionSlider() {
            motionThreshold = parseInt(motionSlider.value);
            document.getElementById('motion-label').innerText = `Motion Filter Threshold: ${motionThreshold}`;
        }

        // Initialize Camera Hardware
        navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } })
            .then(stream => {
                video.srcObject = stream;
                video.addEventListener('loadedmetadata', () => {
                    viewCanvas.width = video.videoWidth;
                    viewCanvas.height = video.videoHeight;
                    requestAnimationFrame(trackObjectLoop);
                });
            })
            .catch(err => {
                document.getElementById('guide-text').innerHTML = "❌ Camera access denied. Proximity engine failed.";
            });

        // Matchmaking Connection Infrastructure
        const myRoomId = Math.floor(100000 + Math.random() * 900000).toString();
        document.getElementById('my-id-display').innerText = myRoomId;
        
        peer = new Peer(myRoomId + "-vision-game");
        peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            isHost = false; 
            document.getElementById('net-status').innerText = "Connected to Opponent!";
            setupNetworkListener();
        });

        function connectToOpponent() {
            const remoteId = document.getElementById('target-room-input').value.trim();
            if(!remoteId) return alert("Please enter an Arena ID!");
            
            conn = peer.connect(remoteId + "-vision-game");
            isHost = true;
            document.getElementById('net-status').innerText = "Connecting...";
            conn.on('open', () => {
                document.getElementById('net-status').innerText = "Connected to Opponent!";
                setupNetworkListener();
            });
        }

        function setupNetworkListener() {
            conn.on('data', (data) => {
                if(data.type === 'paddle') {
                    if(isHost) p2Y = data.y; 
                    else p1Y = data.y;      
                }
                if(!isHost && data.type === 'ball_sync') {
                    ball = data.ball;
                    scores = data.scores;
                    document.getElementById('score-p1').innerText = scores.p1;
                    document.getElementById('score-p2').innerText = scores.p2;
                }
            });
        }

        function lockNearestObject() {
            objectLocked = true;
            document.getElementById('guide-text').innerHTML = `
                <strong>Target Locked!</strong><br>
                🎮 Background filtered. Move your object up/down close to the camera lens to play!
            `;
        }

        // Differential Frame Tracking Matrix Loop
        function trackObjectLoop() {
            // Draw fresh stream segment to calculation buffer
            viewCtx.drawImage(video, 0, 0, viewCanvas.width, viewCanvas.height);

            const currentFrame = viewCtx.getImageData(0, 0, viewCanvas.width, viewCanvas.height);
            const data = currentFrame.data;

            let sumX = 0;
            let sumY = 0;
            let motionPoints = 0;

            if (prevFrameData) {
                for (let i = 0; i < data.length; i += 4) {
                    // Frame differences calculate pixel delta speeds
                    let rDiff = Math.abs(data[i] - prevFrameData[i]);
                    let gDiff = Math.abs(data[i+1] - prevFrameData[i+1]);
                    let bDiff = Math.abs(data[i+2] - prevFrameData[i+2]);
                    
                    let totalChange = rDiff + gDiff + bDiff;

                    // If pixel movement exceeds threshold, it's our moving controller object
                    if (totalChange > motionThreshold) {
                        let pixelIdx = i / 4;
                        let x = pixelIdx % viewCanvas.width;
                        let y = Math.floor(pixelIdx / viewCanvas.width);

                        sumX += x;
                        sumY += y;
                        motionPoints++;

                        // Highlight tracked object pixels directly on viewfinder feed
                        data[i] = 59; data[i+1] = 130; data[i+2] = 246;
                    }
                }

                // Cache current frame array back onto view panel canvas
                viewCtx.putImageData(currentFrame, 0, 0);

                if (motionPoints > 20) {
                    let avgX = sumX / motionPoints;
                    let avgY = sumY / motionPoints;

                    // Normalize positional outputs (0.0 to 1.0)
                    let targetY = avgY / viewCanvas.height;
                    controllerY = Math.max(0, Math.min(1, targetY));

                    if (objectLocked) {
                        if(isHost) p1Y = controllerY;
                        else p2Y = controllerY;

                        if(conn && conn.open) {
                            conn.send({ type: 'paddle', y: controllerY });
                        }
                    }

                    // Render an exact crosshair directly over the nearest moving target cluster
                    viewCtx.beginPath();
                    viewCtx.arc(avgX, avgY, 10, 0, Math.PI * 2);
                    viewCtx.fillStyle = '#10b981';
                    viewCtx.fill();
                    viewCtx.lineWidth = 2;
                    viewCtx.strokeStyle = '#ffffff';
                    viewCtx.stroke();
                }
            }

            // Save the raw pixel array map to compare against the upcoming frame execution
            prevFrameData = data;

            requestAnimationFrame(trackObjectLoop);
        }

        function resizeGameCanvas() {
            gameCanvas.width = gameCanvas.parentElement.clientWidth;
            gameCanvas.height = gameCanvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeGameCanvas);
        resizeGameCanvas();

        function processGameFrame() {
            if (isHost && conn && conn.open) {
                ball.x += ball.vx;
                ball.y += ball.vy;

                if (ball.y - ball.r <= 0 || ball.y + ball.r >= 1) ball.vy = -ball.vy;

                if (ball.x - ball.r <= 0.04) {
                    if (ball.y >= p1Y - 0.1 && ball.y <= p1Y + 0.1) {
                        ball.vx = Math.abs(ball.vx) * 1.05;
                    } else if (ball.x < 0) {
                        scores.p2++;
                        resetArenaBall();
                    }
                }

                if (ball.x + ball.r >= 0.96) {
                    if (ball.y >= p2Y - 0.1 && ball.y <= p2Y + 0.1) {
                        ball.vx = -Math.abs(ball.vx) * 1.05;
                    } else if (ball.x > 1) {
                        scores.p1++;
                        resetArenaBall();
                    }
                }

                conn.send({ type: 'ball_sync', ball: ball, scores: scores });
                document.getElementById('score-p1').innerText = scores.p1;
                document.getElementById('score-p2').innerText = scores.p2;
            }

            gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

            const pw = gameCanvas.width * 0.015;
            const ph = gameCanvas.height * 0.2;

            // Draw Paddle 1 (Blue)
            gameCtx.fillStyle = '#3b82f6';
            gameCtx.fillRect(gameCanvas.width * 0.04 - pw/2, (p1Y * gameCanvas.height) - ph/2, pw, ph);

            // Draw Paddle 2 (Red)
            gameCtx.fillStyle = '#ef4444';
            gameCtx.fillRect(gameCanvas.width * 0.96 - pw/2, (p2Y * gameCanvas.height) - ph/2, pw, ph);

            // Draw Ball
            gameCtx.beginPath();
            gameCtx.arc(ball.x * gameCanvas.width, ball.y * gameCanvas.height, ball.r * gameCanvas.width, 0, Math.PI*2);
            gameCtx.fillStyle = '#ffffff';
            gameCtx.fill();

            requestAnimationFrame(processGameFrame);
        }

        function resetArenaBall() {
            ball.x = 0.5; ball.y = 0.5;
            ball.vx = (Math.random() > 0.5 ? 1 : -1) * 0.004;
            ball.vy = (Math.random() - 0.5) * 0.005;
        }

        requestAnimationFrame(processGameFrame);
    </script>
</body>
</html>
